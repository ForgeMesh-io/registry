# Publishes the registry and portal to GitHub Pages.
# Daily: re-signs the online roles (snapshot, timestamp) so clients never see
# expired metadata, and refreshes portal statistics from the swarms' state branches.
# Online keys come from the `online-keys` environment (main branch only, no reviewers so the
# daily run is never blocked); offline keys never touch CI.
name: pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
      - run: node --check site/app.js

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: online-keys
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: registry
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ForgeMesh-io/nexus
          ref: ${{ vars.NEXUS_REF }}
          path: nexus
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r nexus/docker/requirements.lock
      - name: Re-sign online roles
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          TIMESTAMP_KEY: ${{ secrets.TIMESTAMP_KEY }}
        run: |
          if [ -z "$SNAPSHOT_KEY" ] || [ -z "$TIMESTAMP_KEY" ]; then
            echo "::error::SNAPSHOT_KEY/TIMESTAMP_KEY missing from the online-keys environment (docs/MANUAL_STEPS.md)"
            exit 1
          fi
          keys="$(mktemp -d)"
          umask 077
          printf '%s\n' "$SNAPSHOT_KEY" > "$keys/DEV-snapshot.pem"
          printf '%s\n' "$TIMESTAMP_KEY" > "$keys/DEV-timestamp.pem"
          FORGEMESH_KEYS="$keys" python registry/dev_registry.py refresh
          rm -rf "$keys"
      - name: Build portal from public state
        working-directory: registry
        run: python build_site.py
      - name: Self-check with the verifying client
        run: |
          cd registry/site
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          anchor="$(sha256sum metadata/1.root.json | cut -d' ' -f1)"
          for swarm in nexus vie orbis; do
            PYTHONPATH="$GITHUB_WORKSPACE/nexus" python -m forgemesh verify --registry http://127.0.0.1:8765 \
              --anchor "$anchor" --swarm "$swarm" --cache "$RUNNER_TEMP/tuf" > /dev/null
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: registry/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
